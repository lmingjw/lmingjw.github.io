<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>网站维护中 - lmingjw.github.io</title>
    <style>
        /* 全局样式 */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: "Microsoft YaHei", sans-serif;
            background-color: #f0f2f5;
            overflow: hidden; /* 防止滚动 */
        }

        /* 遮罩层 */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        /* 公告大框框 */
        .notice-box {
            background: #fff;
            width: 90%;
            max-width: 500px;
            padding: 40px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            animation: fadeIn 0.5s ease;
        }

        .icon-warning {
            font-size: 60px;
            color: #f39c12;
            margin-bottom: 20px;
            display: block;
        }

        .title {
            font-size: 32px;
            font-weight: bold;
            color: #333;
            margin-bottom: 20px;
            letter-spacing: 2px;
        }

        .content-text {
            font-size: 14px;
            color: #666;
            line-height: 1.8;
            text-align: left;
            margin-bottom: 30px;
            white-space: pre-line; /* 保留换行格式 */
        }

        .signature {
            text-align: right;
            font-size: 14px;
            color: #333;
            font-weight: bold;
            margin-top: 20px;
        }

        /* 按钮样式 */
        .btn-confirm {
            background-color: #007BFF;
            color: white;
            border: none;
            padding: 10px 30px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .btn-confirm:hover {
            background-color: #0056b3;
        }

        /* 维护中状态页 (初始隐藏) */
        .maintenance-state {
            display: none;
            height: 100%;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .status-box {
            width: 300px;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background: #fff;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .status-text {
            color: red;
            font-size: 24px;
            font-weight: bold;
            margin: 10px 0;
        }

        .status-sub {
            font-size: 12px;
            color: #999;
        }

        /* 右上角联系我按钮 */
        .contact-fab {
            position: fixed;
            top: 20px;
            right: 20px;
            background-color: #25D366; /* 微信绿风格 */
            color: white;
            padding: 10px 15px;
            border-radius: 30px;
            font-size: 14px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            z-index: 1001;
            display: none; /* 初始隐藏 */
            transition: transform 0.2s;
        }
        
        .contact-fab:hover {
            transform: scale(1.05);
        }

        /* 联系方式弹窗 */
        .contact-modal {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            z-index: 1002;
            width: 80%;
            max-width: 350px;
            display: none;
            text-align: left;
        }

        .contact-item {
            margin-bottom: 15px;
            font-size: 14px;
            color: #333;
        }
        
        .contact-label {
            font-weight: bold;
            display: block;
            margin-bottom: 5px;
            color: #555;
        }

        .close-contact {
            display: block;
            width: 100%;
            padding: 10px;
            background: #eee;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 20px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>

    <!-- 1. 初始公告弹窗 -->
    <div class="overlay" id="noticeOverlay">
        <div class="notice-box">
            <span class="icon-warning">⚠️</span>
            <div class="title">维护公告</div>
            <div class="content-text">
亲爱的用户：

为了保证服务质量与您的观览体验，本网站依据《GitHub网络安全使用规范》、《中华人民共和国网络安全法则》、《GitHub用户与使用守则》于2026年8月26日7:15正式进入维护模式，完成时间待定，敬请谅解！
            </div>
            <div class="signature">lmingjw.github.io创办人</div>
            <button class="btn-confirm" onclick="confirmMaintenance()">确定</button>
        </div>
    </div>

    <!-- 2. 维护中状态页 -->
    <div class="maintenance-state" id="maintenanceState">
        <div class="status-box">
            <div class="status-text">网站维护中...</div>
            <div class="status-sub">详情见公告</div>
        </div>
    </div>

    <!-- 3. 右上角联系我按钮 -->
    <div class="contact-fab" id="contactBtn" onclick="toggleContact()">联系我</div>

    <!-- 4. 联系方式弹窗 -->
    <div class="contact-modal" id="contactModal">
        <h3>📱 联系我</h3>
        <p style="font-size:12px; color:#666; margin-bottom:20px;">网络ID：世间过客</p>
        
        <div class="contact-item">
            <span class="contact-label">💬 微信</span>
            sshwdry400
        </div>
        <div class="contact-item">
            <span class="contact-label">🐧 QQ</span>
            2121513426
        </div>
        <div class="contact-item">
            <span class="contact-label">🎵 抖音</span>
            95748489310
        </div>
        <div class="contact-item">
            <span class="contact-label">📹 快手</span>
            qq2121513426
        </div>
        
        <button class="close-contact" onclick="toggleContact()">关闭</button>
    </div>

    <script>
        function confirmMaintenance() {
            // 隐藏公告
            document.getElementById('noticeOverlay').style.display = 'none';
            // 显示维护状态
            document.getElementById('maintenanceState').style.display = 'flex';
            // 显示联系我按钮
            document.getElementById('contactBtn').style.display = 'block';
        }

        function toggleContact() {
            const modal = document.getElementById('contactModal');
            if (modal.style.display === 'block') {
                modal.style.display = 'none';
            } else {
                modal.style.display = 'block';
            }
        }

        // 点击遮罩层外部关闭联系方式
        window.onclick = function(event) {
            const modal = document.getElementById('contactModal');
            if (event.target == modal) {
                modal.style.display = "none";
            }
        }
    </script>
</body>
</html>
